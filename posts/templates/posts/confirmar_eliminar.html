{% extends 'posts/base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3 text-center">
        <h2>¿Estás seguro de eliminar "{{ post.titulo }}"?</h2>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'detalle_post' post.pk %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
